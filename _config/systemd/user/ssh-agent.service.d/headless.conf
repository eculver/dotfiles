# Host ssh-agent for a headless Ubuntu devenv, at the path devenv-ssh-sign and
# conf.d/05-ssh-agent.zsh expect. Stock Ubuntu never starts it there: only
# graphical-session-pre.target wants the unit, and its agent-launch helper
# exits without starting anything when the user manager already has an
# SSH_AUTH_SOCK (gpg-agent's ssh socket claims one). Run ssh-agent directly.
#
# Link into ~/.config/systemd/user/ssh-agent.service.d/, then once:
#   systemctl --user add-wants default.target ssh-agent.service
[Service]
# A killed agent (e.g. by the OOM killer) leaves its socket behind, and bind
# then fails until it is removed.
ExecStartPre=-/usr/bin/rm -f %t/openssh_agent
ExecStart=
ExecStart=/usr/bin/ssh-agent -D -a %t/openssh_agent
ExecStopPost=
